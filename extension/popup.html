<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Auto Bookmark</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #e9edf1;
        --sheet: #f9fafb;
        --ink: #1b2430;
        --ease: cubic-bezier(0.23, 1, 0.32, 1);
        --soft: #4a5565;
        --faint: #7a8594;
        --rule: #d3dae2;
        --action: #2446c7;
        --danger: #b42318;
        --ok: #15803d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 380px;
        font: 13px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--sheet);
      }
      button, input { font: inherit; color: inherit; }
      a { color: inherit; }

      header { padding: 12px 12px 10px; border-bottom: 1px solid var(--rule); background: #fff; }
      .search { position: relative; }
      .search svg { position: absolute; left: 10px; top: 50%; translate: 0 -50%; width: 15px; height: 15px; color: var(--faint); pointer-events: none; }
      .search input {
        width: 100%; height: 34px; padding: 0 10px 0 32px;
        border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet);
      }
      .search input:focus { outline: none; border-color: var(--action); background: #fff; box-shadow: 0 0 0 3px rgb(36 70 199 / 0.12); }

      main { padding: 14px 12px 12px; min-height: 120px; }
      .status { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--faint); margin-bottom: 6px; }
      .status.ok { color: var(--ok); }
      .status.err { color: var(--danger); }
      .status.split { justify-content: space-between; }

      /* The page's card. A ribbon in the category's colour hangs from its top edge, as in the app. */
      .sheet { position: relative; padding: 14px 14px 14px 40px; border: 1px solid var(--rule); border-radius: 12px; background: #fff; }
      .flag { position: absolute; top: -1px; left: 14px; width: 12px; height: 38px; overflow: hidden; }
      .flag i, .mark { display: block; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - var(--notch, 4px)), 0 100%); }
      .flag i { height: 100%; background: var(--rule); }
      .flag i.pending { background: repeating-linear-gradient(180deg, var(--faint) 0 6px, transparent 6px 10px); background-size: 100% 20px; }
      .mark { --notch: 2px; width: 6px; height: 11px; flex: none; }
      .title { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .site { margin-top: 2px; font-size: 12px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .summary { margin: 10px 0 0; color: var(--soft); }
      .muted { color: var(--soft); margin: 6px 0 0; }
      .category { font-size: 12px; font-weight: 600; }
      .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 10px; }
      .tag { font-size: 12px; color: var(--faint); }

      .actions { display: flex; gap: 8px; margin-top: 14px; }
      .btn { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--rule); background: #fff; font-weight: 500; cursor: pointer;
        transition: background-color 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease), transform 160ms var(--ease); }
      .btn:active:not(:disabled) { transform: scale(0.97); }
      .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
      .btn:disabled { opacity: 0.6; cursor: default; }
      .link { background: none; border: 0; padding: 0; color: var(--action); cursor: pointer; font-weight: 500; }

      .skeleton { height: 10px; border-radius: 4px; background: linear-gradient(90deg, var(--paper), #f3f5f7, var(--paper)); background-size: 200% 100%; animation: shimmer 1.2s infinite; margin-top: 8px; }
      @keyframes shimmer { to { background-position: -200% 0; } }
      .spinner { width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; }
      @keyframes spin { to { rotate: 360deg; } }

      .results { list-style: none; margin: 0 -6px; padding: 0; }
      .understood q { color: var(--ink); quotes: "“" "”"; }
      .results li + li { border-top: 1px solid var(--rule); }
      .result { display: block; width: 100%; text-align: left; padding: 9px 6px; border: 0; border-radius: 8px; background: none; cursor: pointer; transition: background-color 120ms var(--ease); }
      .result:focus-visible { background: var(--paper); outline: none; }

      @media (hover: hover) and (pointer: fine) {
        .btn:hover:not(:disabled) { background: var(--paper); }
        .btn.primary:hover:not(:disabled) { background: var(--action); border-color: var(--action); }
        .btn.danger:hover:not(:disabled) { color: var(--danger); border-color: var(--danger); background: #fff; }
        .link:hover { text-decoration: underline; }
        .result:hover { background: var(--paper); }
      }
      @media (prefers-reduced-motion: no-preference) {
        .flag i.pending { animation: crawl 1.2s linear infinite; }
        /* Plays once, when a fresh save is filed: the ribbon drops into the category's colour. */
        .flag i.drop { animation: drop 520ms var(--ease) both; }
      }
      @keyframes crawl { to { background-position: 0 20px; } }
      @keyframes drop { from { transform: translateY(-100%); } }
      @media (prefers-reduced-motion: reduce) {
        .btn:active:not(:disabled) { transform: none; }
        .skeleton { animation: none; }
      }
      .result .title { font-size: 13px; }
      .result .summary { margin-top: 3px; font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .result .row { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--faint); margin-top: 4px; white-space: nowrap; }
      .result .row > span { overflow: hidden; text-overflow: ellipsis; }
      .result .row .cat { display: inline-flex; align-items: center; gap: 5px; color: var(--soft); font-weight: 500; }
      .understood { font-size: 12px; color: var(--faint); margin: 0 0 6px; }

      footer { display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--faint); background: #fff; }
      footer .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      footer .link { font-size: 12px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header id="header" hidden>
      <form class="search" id="search-form" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
        <input id="q" type="search" placeholder="Search your library: “that sourdough video”" aria-label="Search your library" autocomplete="off" />
      </form>
    </header>
    <main id="main" aria-live="polite"></main>
    <footer id="footer" hidden>
      <span class="who" id="who"></span>
      <button type="button" class="link" id="open-library">Library</button>
      <button type="button" class="link" id="open-options">Settings</button>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
